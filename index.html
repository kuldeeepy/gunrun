<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gunrun</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: ui-monospace, Menlo, monospace; color: #fff; }
    #wrap { position: absolute; inset: 0; margin: auto; aspect-ratio: 16 / 9; max-width: 100vw; max-height: 100vh; }
    canvas { width: 100%; height: 100%; display: block; }
    .hud { position: absolute; inset: 0; pointer-events: none; text-shadow: 0 2px 0 #000, 0 0 6px #000; }
    #score { position: absolute; right: 2%; top: 2.5%; font-size: 2.4vmin; font-weight: 700; }
    #time { position: absolute; left: 50%; top: 2.5%; transform: translateX(-50%); font-size: 2.4vmin; }
    #lives { position: absolute; left: 2%; top: 2.5%; font-size: 2.4vmin; letter-spacing: 0.3em; color: #7fd0ff; }
    #slots { position: absolute; left: 2%; bottom: 3%; display: flex; gap: 0.8vmin; font-size: 2vmin; }
    #slots div { padding: 0.5vmin 1.2vmin; background: #000a; border: 2px solid #567; border-radius: 4px; }
    #slots div.on { border-color: #ffd23f; }
    #banner { position: absolute; left: 0; right: 0; top: 30%; text-align: center; font-size: 5vmin; font-weight: 800; color: #ffd23f; transition: opacity .4s; }
    #overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; white-space: pre; font-size: 2.6vmin; line-height: 1.6; }
    #overlay:not(:empty) { background: #0008; }
    #title { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2vmin; background: radial-gradient(#0b1a2ecc, #000e); pointer-events: auto; }
    #title h1 { margin: 0; font-size: 11vmin; color: #ffd23f; letter-spacing: 0.08em; text-shadow: 0 0.8vmin 0 #6b1d0e; }
    #title p { margin: 0; font-size: 2.3vmin; opacity: .85; }
    #title .go { font-size: 3vmin; color: #ffd23f; animation: blink 1s infinite; }
    @keyframes blink { 50% { opacity: .25; } }
    #title .pick { font-size: 3vmin; min-width: 60vmin; display: flex; justify-content: space-between; padding: .6vmin 2vmin; border-radius: 1vmin; }
    #title .pick.on { background: #ffd23f22; color: #ffd23f; }
    #title { background: linear-gradient(90deg, #000d 0%, #0008 45%, #0000 70%); align-items: flex-start; padding-left: 7%; box-sizing: border-box; }
    #combo { position: absolute; right: 2%; top: 8%; font-size: 3vmin; font-weight: 800; color: #ffd23f; transition: transform .08s; }
    .pop { position: absolute; transform: translate(-50%, -100%); font-weight: 800; pointer-events: none; white-space: nowrap; }
    #results { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 1.2vmin; background: #000b; font-size: 2.8vmin; }
    #results .row { display: flex; justify-content: space-between; width: 56vmin; opacity: 0; transition: opacity .2s; }
    #results .row.show { opacity: 1; }
    #results .total { border-top: 2px solid #ffd23f; padding-top: 1vmin; color: #ffd23f; font-weight: 800; }
    #rank { font-size: 16vmin; font-weight: 900; color: #ffd23f; text-shadow: 0 0 3vmin #ff8a00; transform: scale(3); opacity: 0; transition: transform .25s cubic-bezier(.2,1.6,.4,1), opacity .15s; }
    #rank.show { transform: scale(1); opacity: 1; }
    #tip { color: #9ff3ff; min-height: 3vmin; opacity: 0; transition: opacity .3s; }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="c"></canvas>
    <div class="hud">
      <div id="lives"></div><div id="time"></div><div id="score"></div>
      <div id="slots"></div><div id="combo"></div><div id="pops"></div><div id="banner"></div><div id="overlay"></div>
      <div id="results"><div id="rows"></div><div id="rank"></div><div id="tip"></div><p id="again" hidden>Enter — play again</p></div>
      <div id="title">
        <h1>GUNRUN</h1>
        <p>OPERATION GREEN HELL</p>
        <p id="loading">loading models…</p>
        <div class="pick on" id="pick0"></div>
        <div class="pick" id="pick1"></div>
        <p class="go" hidden>PRESS ENTER</p>
        <p>↑↓ choose · ←→ change · then: ←→↑↓ move/aim · Z jump · X fire · C aim-lock · V swap · Esc pause</p>
      </div>
    </div>
  </div>
  <script type="module" src="/src/three/main.ts"></script>
</body>
</html>
